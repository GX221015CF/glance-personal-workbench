<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>个人工作台介绍视频</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f3f5f4;
      color: #202925;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main { width: min(100%, 1040px); }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 24px; font-weight: 650; }

    .metadata { color: #52635a; font-size: 14px; white-space: nowrap; }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #101513;
      border-radius: 6px;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: #52635a;
      font-size: 14px;
    }

    a { color: #176b55; text-underline-offset: 3px; }

    @media (max-width: 560px) {
      body { padding: 20px 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 6px; }
      h1 { font-size: 21px; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>个人工作台</h1>
      <span class="metadata">介绍视频 · 68 秒 · 静音</span>
    </header>
    <video controls playsinline preload="metadata" poster="../media/home.png" aria-label="个人工作台介绍视频">
      <source src="../media/workbench-intro.mp4" type="video/mp4">
      您的浏览器暂不支持 HTML5 视频播放。<a href="../media/workbench-intro.mp4">下载 MP4 文件</a>。
    </video>
    <footer>
      <span>1920 × 1080 · H.264 · 无音轨</span>
      <span><a href="../media/workbench-intro.mp4">下载原始 MP4</a> · <a href="https://github.com/GX221015CF/glance-personal-workbench">返回仓库 README</a></span>
    </footer>
  </main>
</body>
</html>
